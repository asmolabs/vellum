<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vellum Web Companion</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2f;
      --card-hover: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --badge-series: rgba(167, 139, 250, 0.15);
      --badge-series-text: #c4b5fd;
      --badge-tag: rgba(59, 130, 246, 0.15);
      --badge-tag-text: #93c5fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 20px;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .brand span.logo { font-size: 24px; }
    .badge-count {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      font-weight: 600;
    }
    .search-row {
      position: relative;
      display: flex;
      gap: 8px;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      font-weight: 600;
    }
    main {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }
    @media (max-width: 640px) {
      .book-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
      main { padding: 12px; }
    }
    .book-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .book-card:hover {
      background: var(--card-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .cover-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #1e293b;
      position: relative;
      overflow: hidden;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      background: linear-gradient(135deg, #1e1b4b, #312e81);
    }
    .book-info {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 4px;
    }
    .series-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--badge-series-text);
      background: var(--badge-series);
      padding: 2px 6px;
      border-radius: 4px;
      align-self: flex-start;
      margin-bottom: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .book-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .book-author {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .book-actions {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn-read {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-read:hover { background: var(--primary-hover); }
    .btn-download {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 7px 8px;
      flex: 0 0 auto;
    }
    .btn-download:hover { background: rgba(255, 255, 255, 0.15); }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state span { font-size: 48px; display: block; margin-bottom: 12px; }
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      border: 3px dashed var(--primary);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #c7d2fe;
    }
    .drop-overlay.active { display: flex; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 150;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); }
    .modal-field input {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
    }
    .web-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 250;
      display: none;
    }
  </style>
</head>
<body>
  <div class="drop-overlay" id="drop-overlay">📤 Déposez vos livres ici...</div>
  <div class="web-toast" id="web-toast"></div>
  <input type="file" id="upload-input" multiple accept=".epub,.pdf,.cbz,.cbr,.mobi,.azw3,.txt,.mp3,.m4b" style="display:none">
  <header>
    <div class="header-content">
      <div class="brand-row">
        <div class="brand">
          <span class="logo">📚</span>
          <span>Vellum Companion</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <button type="button" id="upload-btn" class="badge-count" style="cursor:pointer;background:var(--primary);color:#fff;border-color:var(--primary);" onclick="document.getElementById('upload-input').click()">📤 Importer</button>
          <a href="/api/export?format=csv" class="badge-count" style="text-decoration:none;">CSV</a>
          <a href="/api/export?format=json" class="badge-count" style="text-decoration:none;">JSON</a>
          <a href="/api/export?format=bibtex" class="badge-count" style="text-decoration:none;">BibTeX</a>
          <span class="badge-count" id="book-count">0 livres</span>
        </div>
      </div>
      <div class="search-row">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-box" class="search-input" placeholder="Rechercher par titre, auteur, saga, tag...">
      </div>
      <div class="chips-row" id="series-chips"></div>
    </div>
  </header>

  <main>
    <div class="book-grid" id="books-container">
      <div class="empty-state">
        <span>⏳</span>
        <span id="loading-label">Chargement de la bibliothèque...</span>
      </div>
    </div>
  </main>

  <div class="modal-backdrop" id="edit-modal" onclick="if(event.target===this) closeEditModal()">
    <div class="modal-card">
      <h3 id="edit-modal-title" style="font-size:16px;">Modifier le livre</h3>
      <input type="hidden" id="edit-book-id">
      <label class="modal-field">Titre <input type="text" id="edit-title"></label>
      <label class="modal-field">Auteur <input type="text" id="edit-author"></label>
      <div style="display:flex;gap:8px;">
        <label class="modal-field" style="flex:1;">Saga / Série <input type="text" id="edit-series"></label>
        <label class="modal-field" style="width:90px;">Tome <input type="number" step="0.5" id="edit-series-idx"></label>
      </div>
      <label class="modal-field">Tags (séparés par des virgules) <input type="text" id="edit-tags"></label>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
        <button type="button" id="edit-cancel-btn" class="btn btn-download" onclick="closeEditModal()">Annuler</button>
        <button type="button" id="edit-save-btn" class="btn btn-read" style="flex:0 0 auto;padding:8px 16px;" onclick="saveBookMetadata()">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    let allBooks = [];
    let selectedSeries = null;
    let i18nMessages = {
      'web.search_ph': 'Rechercher par titre, auteur, saga, tag...',
      'web.loading_library': 'Chargement de la bibliothèque...',
      'web.load_error': 'Impossible de charger les livres',
      'web.connection_error': 'Erreur de connexion au serveur Vellum : {error}',
      'web.all_series': 'Toutes les séries',
      'web.books_count': '{count} livre(s)',
      'web.empty_search': 'Aucun livre ne correspond à votre recherche.',
      'web.read_btn': '📖 Lire',
      'web.download_title': 'Télécharger ({format})'
    };

    function t(key, vars = {}) {
      let text = i18nMessages[key] || key;
      for (const [k, v] of Object.entries(vars)) {
        text = text.replace(`{${k}}`, String(v));
      }
      return text;
    }

    async function loadI18n() {
      try {
        const res = await fetch('/api/i18n');
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.locale) {
          document.documentElement.lang = data.locale;
        }
        if (data && data.messages) {
          i18nMessages = { ...i18nMessages, ...data.messages };
        }
        document.getElementById('search-box').placeholder = t('web.search_ph');
        const loadingEl = document.getElementById('loading-label');
        if (loadingEl) loadingEl.textContent = t('web.loading_library');
      } catch (_) {}
    }

    async function loadLibrary() {
      await loadI18n();
      try {
        const res = await fetch('/api/books');
        if (!res.ok) throw new Error(t('web.load_error'));
        allBooks = await res.json();
        renderSeriesChips();
        renderBooks();
      } catch (e) {
        document.getElementById('books-container').innerHTML = `
          <div class="empty-state">
            <span>⚠️</span>
            ${escapeHtml(t('web.connection_error', { error: e.message }))}
          </div>
        `;
      }
    }

    function renderSeriesChips() {
      const seriesSet = new Set();
      allBooks.forEach(b => {
        if (b.series && b.series.trim()) seriesSet.add(b.series.trim());
      });

      const container = document.getElementById('series-chips');
      if (seriesSet.size === 0) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';
      let html = `<div class="chip ${selectedSeries === null ? 'active' : ''}" onclick="filterSeries(null)">${escapeHtml(t('web.all_series'))}</div>`;
      seriesSet.forEach(s => {
        const active = selectedSeries === s ? 'active' : '';
        html += `<div class="chip ${active}" onclick="filterSeries('${escapeHtml(s)}')">${escapeHtml(s)}</div>`;
      });
      container.innerHTML = html;
    }

    function filterSeries(s) {
      selectedSeries = s;
      renderSeriesChips();
      renderBooks();
    }

    function renderBooks() {
      const q = document.getElementById('search-box').value.toLowerCase().trim();
      const filtered = allBooks.filter(b => {
        const matchSeries = selectedSeries ? (b.series && b.series.trim() === selectedSeries) : true;
        if (!matchSeries) return false;

        if (!q) return true;
        const inTitle = (b.title || '').toLowerCase().includes(q);
        const inAuthor = (b.author || '').toLowerCase().includes(q);
        const inSeries = (b.series || '').toLowerCase().includes(q);
        const inTags = (b.tags || []).some(t => t.toLowerCase().includes(q));
        return inTitle || inAuthor || inSeries || inTags;
      });

      document.getElementById('book-count').textContent = t('web.books_count', { count: filtered.length });

      const container = document.getElementById('books-container');
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <span>📖</span>
            ${escapeHtml(t('web.empty_search'))}
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(b => {
        const coverHtml = b.has_cover
          ? `<img class="cover-img" src="/opds/covers/${b.id}" alt="${escapeHtml(b.title)}" loading="lazy">`
          : `<div class="cover-placeholder">📖</div>`;

        let seriesBadge = '';
        if (b.series) {
          const idxStr = b.series_index != null ? ` • T.${b.series_index}` : '';
          seriesBadge = `<span class="series-badge" title="${escapeHtml(b.series)}">${escapeHtml(b.series)}${idxStr}</span>`;
        }

        const primaryFormat = (b.formats && b.formats[0]) ? b.formats[0].format.toLowerCase() : 'epub';

        return `
          <div class="book-card">
            <div class="cover-wrap">
              ${coverHtml}
            </div>
            <div class="book-info">
              ${seriesBadge}
              <div class="book-title" title="${escapeHtml(b.title)}">${escapeHtml(b.title)}</div>
              <div class="book-author" title="${escapeHtml(b.author)}">${escapeHtml(b.author)}</div>
              <div class="book-actions">
                <a class="btn btn-read" href="/read/${b.id}">${escapeHtml(t('web.read_btn'))}</a>
                <a class="btn btn-download" href="/opds/download/${b.id}/${primaryFormat}" title="${escapeHtml(t('web.download_title', { format: primaryFormat.toUpperCase() }))}">⬇️</a>
                <button type="button" class="btn btn-download" title="${escapeHtml(t('web.edit_btn'))}" onclick="openEditModal('${escapeHtml(b.id)}')">✏️</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showWebToast(msg) {
      const el = document.getElementById('web-toast');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3500);
    }

    async function uploadFiles(files) {
      for (const file of files) {
        try {
          const res = await fetch(`/api/books/upload?filename=${encodeURIComponent(file.name)}`, {
            method: 'POST',
            body: file
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({ error: res.statusText }));
            showWebToast(t('web.upload_err', { error: err.error || res.statusText }));
          } else {
            const book = await res.json();
            showWebToast(t('web.upload_ok', { title: book.title || file.name }));
          }
        } catch (e) {
          showWebToast(t('web.upload_err', { error: e.message }));
        }
      }
      await loadLibrary();
    }

    function openEditModal(bookId) {
      const b = allBooks.find(x => x.id === bookId);
      if (!b) return;
      document.getElementById('edit-book-id').value = b.id;
      document.getElementById('edit-title').value = b.title || '';
      document.getElementById('edit-author').value = b.author || '';
      document.getElementById('edit-series').value = b.series || '';
      document.getElementById('edit-series-idx').value = b.series_index != null ? b.series_index : '';
      document.getElementById('edit-tags').value = (b.tags || []).join(', ');
      document.getElementById('edit-modal-title').textContent = t('web.edit_title');
      document.getElementById('edit-save-btn').textContent = t('web.save_btn');
      document.getElementById('edit-cancel-btn').textContent = t('web.cancel_btn');
      document.getElementById('edit-modal').classList.add('open');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('open');
    }

    async function saveBookMetadata() {
      const id = document.getElementById('edit-book-id').value;
      const idxRaw = document.getElementById('edit-series-idx').value.trim();
      const seriesRaw = document.getElementById('edit-series').value.trim();
      const tagsRaw = document.getElementById('edit-tags').value;
      const payload = {
        title: document.getElementById('edit-title').value.trim(),
        author: document.getElementById('edit-author').value.trim(),
        series: seriesRaw || null,
        series_index: idxRaw ? parseFloat(idxRaw) : null,
        tags: tagsRaw.split(',').map(s => s.trim()).filter(Boolean)
      };
      const res = await fetch(`/api/books/${encodeURIComponent(id)}/metadata`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        closeEditModal();
        await loadLibrary();
      }
    }

    document.getElementById('upload-input').addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length) uploadFiles(e.target.files);
      e.target.value = '';
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      document.getElementById('drop-overlay').textContent = t('web.drop_hint');
      document.getElementById('drop-overlay').classList.add('active');
    });
    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) {
        document.getElementById('drop-overlay').classList.remove('active');
      }
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      document.getElementById('drop-overlay').classList.remove('active');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        uploadFiles(e.dataTransfer.files);
      }
    });

    document.getElementById('search-box').addEventListener('input', renderBooks);
    window.addEventListener('DOMContentLoaded', loadLibrary);
  </script>
</body>
</html>
