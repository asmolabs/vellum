[package]
name = "vellum-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["desktop"]
desktop = ["vellum-core/desktop", "dioxus/desktop", "dep:rfd", "dep:open"]
mobile = ["vellum-core/mobile", "dioxus/mobile"]

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
vellum-domain = { path = "../vellum-domain" }
vellum-core = { path = "../vellum-core", default-features = false }

dioxus.workspace = true
rfd = { workspace = true, optional = true }
open = { workspace = true, optional = true }
dirs.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
