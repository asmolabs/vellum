# Embedded Server (OPDS & Local REST API)
server.port=8085

# SQLite Database & JPA Configuration
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${user.home}/.vellum/metadata.db
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.asmolabs.vellum=INFO
logging.level.org.hibernate.SQL=WARN

# Vellum Default Paths & Litestream
vellum.library-path=${user.home}/.vellum/library
vellum.plugins-path=${user.home}/.vellum/plugins
vellum.opds.enabled=true
vellum.litestream.enabled=false
vellum.litestream.replica-type=file
vellum.litestream.replica-path=${user.home}/.vellum/backups
vellum.litestream.binary-path=litestream
